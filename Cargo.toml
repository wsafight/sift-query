[workspace]
members = [
    "crates/sift-query-algorithm",
    "crates/sift-query-core",
    "crates/sift-query-derive",
    "crates/sift-query-sqlx",
    "crates/sift-query-sqlx-common",
    "crates/sift-query-mysql",
    "crates/sift-query-sqlite",
    "crates/sift-query",
    "examples/axum-postgres",
    "examples/actix-postgres",
    "examples/poem-postgres",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
repository = "https://github.com/wsafight/sift-query.git"

[workspace.dependencies]
actix-web = "4.11.0"
axum = "0.8.6"
async-stream = "0.3.6"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false }
chrono-tz = "0.10.4"
criterion = "0.7.0"
hmac = "0.12.1"
futures-core = "0.3.31"
futures-util = "0.3.31"
indexmap = "2.11.4"
poem = "3.1.12"
proc-macro2 = "1.0.101"
quote = "1.0.41"
rust_decimal = { version = "1.39.0", default-features = false }
serde = "1.0.228"
serde_json = "1.0.145"
sha2 = "0.10.9"
sift-query-algorithm = { version = "0.1.0", path = "crates/sift-query-algorithm" }
sift-query-sqlx-common = { version = "0.1.0", path = "crates/sift-query-sqlx-common" }
sqlx = { version = "0.9.0", default-features = false }
syn = { version = "2.0.106", features = ["full", "extra-traits"] }
thiserror = "2.0.17"
tokio = { version = "1.47.1", default-features = false }
tracing = "0.1.41"
uuid = { version = "1.18.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
new_ret_no_self = "allow"
too_many_lines = "allow"
type_complexity = "allow"
wildcard_imports = "allow"

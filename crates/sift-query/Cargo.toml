[package]
name = "sift-query"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A parameter-driven, read-only query layer for Rust"
readme = "README.md"
documentation = "https://docs.rs/sift-query"
homepage = "https://docs.rs/sift-query"
keywords = ["sqlx", "query", "postgres", "filter", "search"]
categories = ["database", "web-programming"]

[features]
default = ["postgres", "chrono", "decimal", "json", "serde", "uuid"]
postgres = ["dep:sift-query-sqlx", "dep:sift-query-sqlx-common"]
mysql = ["dep:sift-query-mysql", "dep:sift-query-sqlx-common"]
sqlite = ["dep:sift-query-sqlite", "dep:sift-query-sqlx-common"]
axum = [
    "dep:sift-query-sqlx-common",
    "sift-query-sqlx-common/axum",
    "sift-query-sqlx?/axum",
    "sift-query-mysql?/axum",
    "sift-query-sqlite?/axum",
]
actix-web = [
    "dep:sift-query-sqlx-common",
    "sift-query-sqlx-common/actix-web",
    "sift-query-sqlx?/actix-web",
    "sift-query-mysql?/actix-web",
    "sift-query-sqlite?/actix-web",
]
poem = [
    "dep:sift-query-sqlx-common",
    "sift-query-sqlx-common/poem",
    "sift-query-sqlx?/poem",
    "sift-query-mysql?/poem",
    "sift-query-sqlite?/poem",
]
chrono = [
    "sift-query-core/chrono",
    "sift-query-sqlx-common?/chrono",
    "sift-query-sqlx?/chrono",
    "sift-query-mysql?/chrono",
    "sift-query-sqlite?/chrono",
]
decimal = [
    "sift-query-core/decimal",
    "sift-query-sqlx-common?/decimal",
    "sift-query-sqlx?/decimal",
    "sift-query-mysql?/decimal",
]
json = [
    "sift-query-core/json",
    "sift-query-sqlx-common?/json",
    "sift-query-sqlx?/json",
    "sift-query-mysql?/json",
    "sift-query-sqlite?/json",
]
serde = [
    "sift-query-core/serde",
    "sift-query-sqlx-common?/serde",
    "sift-query-sqlx?/serde",
    "sift-query-mysql?/serde",
    "sift-query-sqlite?/serde",
]
uuid = [
    "sift-query-core/uuid",
    "sift-query-sqlx-common?/uuid",
    "sift-query-sqlx?/uuid",
    "sift-query-mysql?/uuid",
    "sift-query-sqlite?/uuid",
]
postgres-types = ["postgres", "sift-query-sqlx/postgres-types"]
postgres-search = ["postgres", "sift-query-sqlx/postgres-search"]
pg-trgm = ["postgres-search", "sift-query-sqlx/pg-trgm"]
postgis = ["postgres-search", "sift-query-sqlx/postgis"]
ltree = ["postgres-search", "sift-query-sqlx/ltree"]
metadata = ["json", "sift-query-core/metadata"]
rsql = ["sift-query-core/rsql"]
rls = ["postgres", "sift-query-sqlx/rls"]

[dependencies]
sift-query-core = { version = "0.2.0", path = "../sift-query-core" }
sift-query-derive = { version = "0.2.0", path = "../sift-query-derive" }
sift-query-sqlx-common = { version = "0.2.0", path = "../sift-query-sqlx-common", optional = true }
sift-query-sqlx = { version = "0.2.0", path = "../sift-query-sqlx", optional = true }
sift-query-mysql = { version = "0.2.0", path = "../sift-query-mysql", optional = true }
sift-query-sqlite = { version = "0.2.0", path = "../sift-query-sqlite", optional = true }

[dev-dependencies]
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "macros"] }

[lints]
workspace = true
